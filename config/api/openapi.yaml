openapi: 3.1.0
info:
  title: TRE Web API (最小可玩草案)
  version: 0.1.0
  description: |
    本文档是 TRE 最小可玩流程的 Web API 契约草案，仅定义接口与参数约束，不包含实现。
    目标：统一会话、回合、记忆、沙盒与重置入口，确保前后端对齐。
servers:
  - url: http://localhost:5000
    description: 本地开发环境
tags:
  - name: Sessions
    description: 会话与生命周期管理
  - name: Turns
    description: 回合执行与历史查询
  - name: Memory
    description: 会话记忆查询与刷新
  - name: Sandbox
    description: 沙盒并入与回滚
  - name: Runtime
    description: 状态重置
  - name: Mods
    description: MOD 注册表与媒体物料
paths:
  /api/sessions:
    get:
      tags: [Sessions]
      summary: 列出会话摘要
      description: 返回最近保存的 Web 会话摘要，供前端选择已有进度继续游戏。
      operationId: listSessions
      parameters:
        - name: limit
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 20
      responses:
        "200":
          description: 查询成功
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ListSessionsResponse"
        "400":
          $ref: "#/components/responses/InvalidArgument"
        "500":
          $ref: "#/components/responses/InternalError"

    post:
      tags: [Sessions]
      summary: 创建会话
      description: 创建一个新的游戏会话并初始化角色与会话元数据。
      operationId: createSession
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateSessionRequest"
      responses:
        "201":
          description: 创建成功
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CreateSessionResponse"
        "400":
          $ref: "#/components/responses/InvalidArgument"
        "500":
          $ref: "#/components/responses/InternalError"

  /api/sessions/{session_id}:
    get:
      tags: [Sessions]
      summary: 获取会话状态
      description: 获取会话元数据与当前回合进度。
      operationId: getSession
      parameters:
        - $ref: "#/components/parameters/SessionIdPath"
      responses:
        "200":
          description: 查询成功
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GetSessionResponse"
        "404":
          $ref: "#/components/responses/SessionNotFound"
        "500":
          $ref: "#/components/responses/InternalError"
    delete:
      tags: [Sessions]
      summary: 删除会话数据
      description: 删除指定 Web 会话、回合、长期记忆、会话级幂等缓存、会话运行角色克隆和 Agent 会话记忆镜像。
      operationId: deleteSession
      parameters:
        - $ref: "#/components/parameters/SessionIdPath"
      responses:
        "200":
          description: 删除成功
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DeleteSessionResponse"
        "400":
          $ref: "#/components/responses/InvalidArgument"
        "404":
          $ref: "#/components/responses/SessionNotFound"
        "500":
          $ref: "#/components/responses/InternalError"

  /api/story-packs:
    get:
      tags: [StoryPacks]
      summary: 列出本地 Story Pack
      description: 返回已通过 A2-Core 校验的本地 story_packs 摘要，以及未通过校验目录的诊断。
      operationId: listStoryPacks
      responses:
        "200":
          description: 查询成功
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ListStoryPacksResponse"
        "500":
          $ref: "#/components/responses/InternalError"
    post:
      tags: [StoryPacks]
      summary: 导入 Story Pack
      description: 接收 manifest、scenes、lore、quests、triggers JSON 文件集合，写入本地 story_packs 后立即校验；坏包不会进入可用列表。
      operationId: importStoryPack
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ImportStoryPackRequest"
      responses:
        "201":
          description: 导入成功
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ImportStoryPackResponse"
        "400":
          $ref: "#/components/responses/InvalidArgument"
        "409":
          description: pack 已存在或受保护
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "500":
          $ref: "#/components/responses/InternalError"

  /api/story-packs/{pack_id}:
    get:
      tags: [StoryPacks]
      summary: 获取 Story Pack 详情
      description: 返回已校验 Story Pack 的 manifest、summary 与 scenes 预览。
      operationId: getStoryPack
      parameters:
        - name: pack_id
          in: path
          required: true
          schema:
            type: string
            pattern: "^[a-zA-Z0-9_-]{3,64}$"
      responses:
        "200":
          description: 查询成功
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GetStoryPackResponse"
        "400":
          $ref: "#/components/responses/InvalidArgument"
        "404":
          description: Story Pack 不存在或未通过校验
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "500":
          $ref: "#/components/responses/InternalError"
    delete:
      tags: [StoryPacks]
      summary: 删除 Story Pack
      description: 删除本地非官方 Story Pack 目录；不会删除历史 session。
      operationId: deleteStoryPack
      parameters:
        - name: pack_id
          in: path
          required: true
          schema:
            type: string
            pattern: "^[a-zA-Z0-9_-]{3,64}$"
      responses:
        "200":
          description: 删除成功
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DeleteStoryPackResponse"
        "400":
          $ref: "#/components/responses/InvalidArgument"
        "404":
          description: Story Pack 不存在
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "409":
          description: 官方 pack 受保护
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "500":
          $ref: "#/components/responses/InternalError"

  /api/story-packs/{pack_id}/assets/{asset_path}:
    get:
      tags: [StoryPacks]
      summary: 获取 Story Pack 多媒体物料
      description: 只返回已通过校验且在 manifest.assets 中声明的 pack/assets 图片、GIF、视频或音频文件。
      operationId: getStoryPackAsset
      parameters:
        - name: pack_id
          in: path
          required: true
          schema:
            type: string
            pattern: "^[a-zA-Z0-9_-]{3,64}$"
        - name: asset_path
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: 媒体文件
          content:
            image/png:
              schema:
                type: string
                format: binary
            image/jpeg:
              schema:
                type: string
                format: binary
            image/webp:
              schema:
                type: string
                format: binary
            image/gif:
              schema:
                type: string
                format: binary
            video/mp4:
              schema:
                type: string
                format: binary
            video/webm:
              schema:
                type: string
                format: binary
            video/ogg:
              schema:
                type: string
                format: binary
            video/quicktime:
              schema:
                type: string
                format: binary
            audio/mpeg:
              schema:
                type: string
                format: binary
            audio/wav:
              schema:
                type: string
                format: binary
            audio/ogg:
              schema:
                type: string
                format: binary
            audio/mp4:
              schema:
                type: string
                format: binary
            audio/flac:
              schema:
                type: string
                format: binary
        "400":
          $ref: "#/components/responses/InvalidArgument"
        "404":
          description: Story Pack 或媒体物料不存在
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "500":
          $ref: "#/components/responses/InternalError"

  /api/mods/media:
    get:
      tags: [Mods]
      summary: 列出启用 MOD 的媒体物料
      description: 返回已启用 MOD 中通过扫描校验的 image/gif/video/audio 媒体声明及只读访问 URL。
      operationId: listModMedia
      responses:
        "200":
          description: 查询成功
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ListModMediaResponse"
        "500":
          $ref: "#/components/responses/InternalError"

  /api/mods/{mod_id}/media/{media_path}:
    get:
      tags: [Mods]
      summary: 获取 MOD 媒体文件
      description: 只返回已启用 MOD 中 media_manifest 声明并通过扫描校验的 assets/ 媒体文件。
      operationId: getModMedia
      parameters:
        - name: mod_id
          in: path
          required: true
          schema:
            type: string
            pattern: "^[a-zA-Z0-9_-]{3,64}$"
        - name: media_path
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: 媒体文件
          content:
            image/png:
              schema:
                type: string
                format: binary
            image/jpeg:
              schema:
                type: string
                format: binary
            image/webp:
              schema:
                type: string
                format: binary
            image/gif:
              schema:
                type: string
                format: binary
            video/mp4:
              schema:
                type: string
                format: binary
            video/webm:
              schema:
                type: string
                format: binary
            video/ogg:
              schema:
                type: string
                format: binary
            video/quicktime:
              schema:
                type: string
                format: binary
            audio/mpeg:
              schema:
                type: string
                format: binary
            audio/wav:
              schema:
                type: string
                format: binary
            audio/ogg:
              schema:
                type: string
                format: binary
            audio/mp4:
              schema:
                type: string
                format: binary
            audio/flac:
              schema:
                type: string
                format: binary
        "400":
          $ref: "#/components/responses/InvalidArgument"
        "404":
          description: MOD 或媒体物料不存在
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "500":
          $ref: "#/components/responses/InternalError"

  /api/sessions/{session_id}/turns:
    post:
      tags: [Turns]
      summary: 执行一个回合（统一入口）
      description: |
        核心回合 API。服务端必须对同一 session_id 的写操作串行化。
        同一 request_id 的重复请求必须返回同一结果（幂等）。
      operationId: createTurn
      parameters:
        - $ref: "#/components/parameters/SessionIdPath"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateTurnRequest"
      responses:
        "200":
          description: 回合执行成功（含动作合法与不合法两种业务结果）
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CreateTurnResponse"
        "400":
          $ref: "#/components/responses/InvalidArgument"
        "404":
          $ref: "#/components/responses/SessionNotFound"
        "409":
          $ref: "#/components/responses/TurnConflict"
        "504":
          description: 回合执行超时
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "500":
          $ref: "#/components/responses/InternalError"
    get:
      tags: [Turns]
      summary: 分页查询回合历史
      operationId: listTurns
      parameters:
        - $ref: "#/components/parameters/SessionIdPath"
        - $ref: "#/components/parameters/PageQuery"
        - $ref: "#/components/parameters/PageSizeQuery"
      responses:
        "200":
          description: 查询成功
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ListTurnsResponse"
        "404":
          $ref: "#/components/responses/SessionNotFound"
        "500":
          $ref: "#/components/responses/InternalError"

  /api/sessions/{session_id}/turns/stream:
    post:
      tags: [Turns]
      summary: 执行一个回合（SSE 流式）
      description: |
        以 `text/event-stream` 返回回合执行进度与终止结果。
        事件序列与实现保持一致：`received`、阶段 progress/detail、`gm_delta`、`done`、`error`。
        终止语义：一次请求必须以 `done` 或 `error` 结束；`done` 负载与 `CreateTurnResponse` 同构。
      operationId: createTurnStream
      parameters:
        - $ref: "#/components/parameters/SessionIdPath"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateTurnRequest"
      responses:
        "200":
          description: |
            流式执行成功建立连接。客户端需持续消费事件，直到收到 `done` 或 `error`。
            `done` 的 data 负载与 `CreateTurnResponse` 字段同构（去掉外层 `ok` 包装）。
          content:
            text/event-stream:
              schema:
                type: string
              examples:
                done:
                  summary: 终止事件（成功）
                  value: |
                    event: done
                    data: {"session_id":"sess_demo_01","session_turn_id":3,"runtime_turn_id":42,"trace_id":"trc_demo_01","request_id":"stream_0001","is_valid":true,"outcome":"valid_action","final_response":"你推开木门，听见屋内传来脚步声。"}
                error:
                  summary: 终止事件（失败）
                  value: |
                    event: error
                    data: {"code":"INTERNAL_ERROR","message":"回合执行失败: ...","trace_id":"trc_demo_01"}
        "400":
          $ref: "#/components/responses/InvalidArgument"
        "404":
          $ref: "#/components/responses/SessionNotFound"
        "409":
          $ref: "#/components/responses/TurnConflict"
        "504":
          description: 回合执行超时（可能作为 SSE `error` 终止事件返回）
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "500":
          $ref: "#/components/responses/InternalError"

  /api/sessions/{session_id}/turns/{session_turn_id}:
    get:
      tags: [Turns]
      summary: 查询单回合详情
      operationId: getTurn
      parameters:
        - $ref: "#/components/parameters/SessionIdPath"
        - $ref: "#/components/parameters/SessionTurnIdPath"
      responses:
        "200":
          description: 查询成功
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GetTurnResponse"
        "404":
          $ref: "#/components/responses/SessionOrTurnNotFound"
        "500":
          $ref: "#/components/responses/InternalError"

  /api/sessions/{session_id}/memory:
    get:
      tags: [Memory]
      summary: 获取会话记忆
      description: 查询当前会话可供叙事或提示词拼接的记忆上下文。
      operationId: getMemory
      parameters:
        - $ref: "#/components/parameters/SessionIdPath"
        - $ref: "#/components/parameters/MemoryFormatQuery"
      responses:
        "200":
          description: 查询成功
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GetMemoryResponse"
        "404":
          $ref: "#/components/responses/SessionNotFound"
        "500":
          $ref: "#/components/responses/InternalError"

  /api/sessions/{session_id}/memory/refresh:
    post:
      tags: [Memory]
      summary: 刷新会话记忆摘要
      operationId: refreshMemory
      parameters:
        - $ref: "#/components/parameters/SessionIdPath"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RefreshMemoryRequest"
      responses:
        "200":
          description: 刷新成功
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RefreshMemoryResponse"
        "400":
          $ref: "#/components/responses/InvalidArgument"
        "404":
          $ref: "#/components/responses/SessionNotFound"
        "500":
          $ref: "#/components/responses/InternalError"

  /api/sessions/{session_id}/sandbox/commit:
    post:
      tags: [Sandbox]
      summary: 并入沙盒
      operationId: commitSandbox
      parameters:
        - $ref: "#/components/parameters/SessionIdPath"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RequestWithIdempotency"
      responses:
        "200":
          description: 并入成功
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SandboxCommitResponse"
        "404":
          $ref: "#/components/responses/SessionNotFound"
        "409":
          $ref: "#/components/responses/TurnConflict"
        "500":
          $ref: "#/components/responses/InternalError"

  /api/sessions/{session_id}/sandbox/diff:
    get:
      tags: [Sandbox]
      summary: 预览沙盒差异
      operationId: previewSandboxDiff
      parameters:
        - $ref: "#/components/parameters/SessionIdPath"
      responses:
        "200":
          description: 预览成功
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SandboxDiffResponse"
        "404":
          $ref: "#/components/responses/SessionNotFound"
        "409":
          $ref: "#/components/responses/TurnConflict"
        "500":
          $ref: "#/components/responses/InternalError"

  /api/sessions/{session_id}/sandbox/discard:
    post:
      tags: [Sandbox]
      summary: 丢弃沙盒
      operationId: discardSandbox
      parameters:
        - $ref: "#/components/parameters/SessionIdPath"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RequestWithIdempotency"
      responses:
        "200":
          description: 丢弃成功
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SandboxDiscardResponse"
        "404":
          $ref: "#/components/responses/SessionNotFound"
        "409":
          $ref: "#/components/responses/TurnConflict"
        "500":
          $ref: "#/components/responses/InternalError"

  /api/sessions/{session_id}/reset:
    post:
      tags: [Runtime]
      summary: 重置会话
      description: |
        重置会话运行状态。默认保留 character_id 并清空回合、记忆和临时上下文。
      operationId: resetSession
      parameters:
        - $ref: "#/components/parameters/SessionIdPath"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ResetSessionRequest"
      responses:
        "200":
          description: 重置成功
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ResetSessionResponse"
        "404":
          $ref: "#/components/responses/SessionNotFound"
        "500":
          $ref: "#/components/responses/InternalError"

components:
  parameters:
    SessionIdPath:
      name: session_id
      in: path
      required: true
      schema:
        type: string
        pattern: "^[a-zA-Z0-9_-]{8,64}$"
    SessionTurnIdPath:
      name: session_turn_id
      in: path
      required: true
      schema:
        type: integer
        minimum: 0
    PageQuery:
      name: page
      in: query
      required: false
      schema:
        type: integer
        minimum: 1
        default: 1
    PageSizeQuery:
      name: page_size
      in: query
      required: false
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 20
    MemoryFormatQuery:
      name: format
      in: query
      required: false
      schema:
        type: string
        enum: [summary, raw]
        default: summary

  responses:
    InvalidArgument:
      description: |
        参数不合法。
        常见场景：session_id/request_id/user_input/memory 参数校验失败。
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorEnvelope"
          example:
            ok: false
            trace_id: trc_01HXYZABCDEF
            error:
              code: INVALID_ARGUMENT
              message: user_input 不能为空
    SessionNotFound:
      description: 会话不存在
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorEnvelope"
          example:
            ok: false
            trace_id: trc_01HXYZABCDEF
            error:
              code: SESSION_NOT_FOUND
              message: session_id 不存在
    SessionOrTurnNotFound:
      description: 会话或回合不存在
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorEnvelope"
          example:
            ok: false
            trace_id: trc_01HXYZABCDEF
            error:
              code: TURN_NOT_FOUND
              message: session_turn_id 不存在
    TurnConflict:
      description: |
        回合并发冲突、幂等冲突或沙盒状态冲突。
        典型错误码：TURN_CONFLICT、IDEMPOTENCY_CONFLICT、SANDBOX_BUSY、
        SANDBOX_OWNER_MISMATCH、SANDBOX_STATE_INVALID、SHADOW_STATE_NOT_FOUND。
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorEnvelope"
          example:
            ok: false
            trace_id: trc_01HXYZABCDEF
            error:
              code: TURN_CONFLICT
              message: 同一 session_id 存在并发写冲突
    InternalError:
      description: 内部错误
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorEnvelope"
          example:
            ok: false
            trace_id: trc_01HXYZABCDEF
            error:
              code: INTERNAL_ERROR
              message: 未知内部异常

  schemas:
    RequestId:
      type: string
      pattern: "^[a-zA-Z0-9_-]{8,64}$"
      description: 幂等请求标识。客户端应保证唯一。
    SessionId:
      type: string
      pattern: "^[a-zA-Z0-9_-]{8,64}$"
    CharacterId:
      type: string
      pattern: "^[a-zA-Z0-9_-]{3,64}$"
      default: player_01
    IsoTime:
      type: string
      format: date-time
    SessionTurnId:
      type: integer
      minimum: 0
    RuntimeTurnId:
      type: integer
      minimum: 0

    ErrorObject:
      type: object
      required: [code, message]
      properties:
        code:
          type: string
          enum:
            - INVALID_ARGUMENT
            - NO_STORY_PACK
            - SESSION_NOT_FOUND
            - CHARACTER_NOT_FOUND
            - TURN_NOT_FOUND
            - TURN_CONFLICT
            - IDEMPOTENCY_CONFLICT
            - SANDBOX_BUSY
            - SANDBOX_OWNER_MISMATCH
            - SANDBOX_STATE_INVALID
